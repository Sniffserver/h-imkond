; PlatformIO Project Configuration File for HÕIMU ESP32 Firmware Target
;

[platformio]
default_envs = esp32dev, native
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
    -std=c++17
    -I.
    -Icrypto
    -Iprotocol
    -Imesh
    -Iradio
    -Istorage
    -Idiagnostics

[env:native]
platform = native
test_framework = custom
build_flags = 
    -std=c++17
    -I.
    -Icrypto
    -Iprotocol
    -Imesh
    -Iradio
    -Istorage
    -Idiagnostics
