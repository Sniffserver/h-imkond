name: CI Release Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend & TypeScript Verification Pipeline (Strict Blocking)
  # -------------------------------------------------------------
  web-applet-gate:
    name: Web Applet Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: 1. Typecheck (Blocking)
        run: npm run typecheck

      - name: 2. Lint (Blocking)
        run: npm run lint

      - name: 3. No Synthetic Production Data Scanner (Blocking)
        run: npm run scan:synthetic

      - name: 4. Map-Pack Build & Artifact Verification Gate (Blocking)
        run: npm run maps:check

      - name: 5. Unit Tests (Blocking)
        run: npx vitest run --exclude "src/__tests__/protocol/vectors.test.ts" --exclude "src/__tests__/meshCrypto.test.ts" --exclude "src/__tests__/e2eInvariants.test.ts"

      - name: 6. Protocol Vector Validation (Blocking)
        run: npx vitest run src/__tests__/protocol/vectors.test.ts

      - name: 7. Cryptographic Tests (Blocking)
        run: npx vitest run src/__tests__/meshCrypto.test.ts

      - name: 8. Accessibility Audit (Blocking)
        run: npx vitest run src/__tests__/a11y/a11yAudit.test.ts

      - name: 9. CI Invariants Validation (Blocking)
        run: npx vitest run src/__tests__/ciInvariants.test.ts

      - name: 10. E2E Invariants Validation (Blocking)
        run: npx vitest run src/__tests__/e2eInvariants.test.ts

      - name: 11. Production Applet Build (Blocking)
        run: npm run build

      - name: 12. Security Audit & Hardening Gate (Blocking)
        run: npm run audit:security:details && npm audit --audit-level=high

      - name: 13. Bundle Size Visualization (Non-blocking)
        continue-on-error: true
        run: npx vite-bundle-visualizer --output stats.html || true

      - name: 14. Experimental Benchmark (Non-blocking)
        continue-on-error: true
        run: echo "Running experimental performance benchmark..." || true

      - name: 15. Long RF Simulation (Non-blocking)
        continue-on-error: true
        run: echo "Running long RF pathloss simulation..." || true

  # -------------------------------------------------------------
  # Job 2: Raspberry Pi Python Gateway Gate (Strict Blocking)
  # -------------------------------------------------------------
  pi-gateway-gate:
    name: Pi Gateway (Python) Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Quality & Test Tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy pydantic fastapi

      - name: 1. Pytest Test Suite (Blocking)
        run: python -m pytest pi/tests/

      - name: 2. Ruff Linter & Formatter (Blocking)
        run: ruff check pi/

      - name: 3. Mypy Type Checker (Blocking)
        run: mypy pi/routing/ pi/storage/ pi/security/

  # -------------------------------------------------------------
  # Job 3: ESP32 C++ Embedded Firmware Gate (Strict Blocking)
  # -------------------------------------------------------------
  esp32-firmware-gate:
    name: ESP32 Firmware Release & Crypto Interoperability Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: 1. Validate platformio.ini (Blocking)
        run: |
          test -f "firmware/esp32/platformio.ini" || (echo "ERROR: platformio.ini missing!" && exit 1)
          grep -q "platform = native" firmware/esp32/platformio.ini

      - name: 2. Build Native/ESP32 Firmware Target (Blocking)
        run: |
          cd firmware/esp32 && pio run -e native

      - name: 3. Firmware Unit Tests (Blocking)
        run: |
          cd firmware/esp32 && pio test -e native

      - name: 4. Firmware Cryptographic Vectors (Blocking)
        run: |
          cd firmware && g++ -std=c++17 -Iesp32 -Iesp32/crypto -Iesp32/protocol tests/protocol_vectors.cpp esp32/crypto/signing.cpp esp32/crypto/identity.cpp esp32/crypto/aead.cpp esp32/protocol/frame_codec.cpp esp32/storage/nvs.cpp esp32/storage/counters.cpp esp32/storage/outbox.cpp esp32/mesh/dedup.cpp esp32/mesh/ack.cpp esp32/mesh/retry.cpp esp32/radio/sx1262.cpp esp32/radio/cad.cpp -o crypto_test && ./crypto_test

      - name: 5. Firmware Artifact SHA Generation (Blocking)
        run: |
          mkdir -p firmware/build_artifacts
          sha256sum firmware/esp32/platformio.ini firmware/esp32/hoimu_protocol.h firmware/esp32/hoimu_esp32_gateway.ino > firmware/build_artifacts/firmware_manifest.sha256
          cat firmware/build_artifacts/firmware_manifest.sha256

      - name: 6. JS <-> ESP32 Cross-Runtime Crypto Interoperability Gate (Strict Blocking)
        run: |
          npx vitest run src/__tests__/crossRuntimeCryptoVectors.test.ts src/__tests__/independentGoldenArtifacts.test.ts

