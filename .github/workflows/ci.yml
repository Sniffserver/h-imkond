name: CI Release Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend & TypeScript Verification Pipeline
  # -------------------------------------------------------------
  web-applet-gate:
    name: Web Applet Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: 1. Typecheck
        run: npm run typecheck

      - name: 2. Lint
        run: npm run lint

      - name: 3. Unit Tests
        run: npx vitest run --exclude "src/__tests__/protocol/vectors.test.ts" --exclude "src/__tests__/meshCrypto.test.ts"

      - name: 4. Protocol Vector Validation
        run: npx vitest run src/__tests__/protocol/vectors.test.ts

      - name: 5. Cryptographic Tests
        run: npx vitest run src/__tests__/meshCrypto.test.ts

      - name: 6. Accessibility Audit
        run: npx vitest run src/__tests__/a11y/a11yAudit.test.ts || true

      - name: 7. Production Applet Build
        run: npm run build

      - name: 8. Bundle Size Analysis
        run: npx vite-bundle-visualizer --output stats.html || true

      - name: 9. Security Audit
        run: npm audit --audit-level=high || true

  # -------------------------------------------------------------
  # Job 2: Raspberry Pi Python Gateway Gate
  # -------------------------------------------------------------
  pi-gateway-gate:
    name: Pi Gateway (Python) Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Quality & Test Tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy pydantic fastapi

      - name: 1. Pytest Test Suite
        run: python -m pytest pi/tests/

      - name: 2. Ruff Linter & Formatter
        run: ruff check pi/ || true

      - name: 3. Mypy Type Checker
        run: mypy pi/routing/ pi/storage/ pi/security/ || true

  # -------------------------------------------------------------
  # Job 3: ESP32 C++ Embedded Firmware Gate
  # -------------------------------------------------------------
  esp32-firmware-gate:
    name: ESP32 Firmware Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: 1. PlatformIO Firmware Build Check
        run: |
          if [ -f "esp32/platformio.ini" ]; then
            cd esp32 && pio run || true
          fi

      - name: 2. PlatformIO Native Unit Tests
        run: |
          if [ -f "esp32/platformio.ini" ]; then
            cd esp32 && pio test -e native || true
          fi
